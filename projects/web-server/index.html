<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Simple Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #2c3e50;
      color: #fff;
      padding: 1.25rem 2rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-bottom: 1rem;
      color: #2c3e50;
    }

    .card p {
      margin-bottom: 1.5rem;
    }

    button {
      background: #3498db;
      color: #fff;
      border: none;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2980b9;
    }

    #output {
      margin-top: 1rem;
      font-weight: 600;
      color: #27ae60;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.875rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Simple Page</h1>
  </header>

  <main>
    <div class="card">
      <h2>Welcome 👋</h2>
      <p>
        This is a minimal HTML starter page with a bit of styling and
        JavaScript. Edit it however you like.
      </p>
      <button id="btn">Click me</button>
      <p id="output"></p>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> My Site
  </footer>

  <script>
    // Current year in the footer
    document.getElementById("year").textContent = new Date().getFullYear();

    // Simple button interaction
    let count = 0;
    const btn = document.getElementById("btn");
    const output = document.getElementById("output");

    btn.addEventListener("click", () => {
      count++;
      output.textContent = `You clicked ${count} time${count === 1 ? "" : "s"}!`;
    });
  </script>
</body>
</html>
