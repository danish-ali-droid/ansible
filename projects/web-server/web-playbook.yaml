- name: install apache
  hosts: webserver
  become: yes
  tasks:
    - name: make sure it is latest
      ansible.builtin.apt:
        name: apache2
        state: latest
    - name: service is runnig
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes
    - name: copy file
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/
        
